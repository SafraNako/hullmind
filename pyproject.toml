[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hullmind"
version = "0.1.0"
description = "Single-ship dismantling planner: mass balance, torch-cutting productivity from a manufacturer table, precedence-constrained team scheduling, break-even bid with Monte Carlo risk, and hazardous-material screening against the IMO inventory thresholds, each cross-checked against an independent method"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SafraNako" }]
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.7",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
hullmind = "hullmind.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
